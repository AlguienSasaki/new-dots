general.import = [
  "~/.config/alacritty/colors.toml"
]

[env]
TERM = "xterm-256color"

[window]
opacity = 0.75
#opacity = 1
title = "Alacritty"

[window.padding]
x = 6
y = 6

[window.class]
instance = "Alacritty"
general = "Alacritty"

[scrolling]
history = 5000

[font]
size = 12.5

[font.normal]
family = "JetbrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetbrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetbrainsMono Nerd Font"
style = "italic"

[font.bold_italic]
family = "JetbrainsMono Nerd Font"
style = "Bold Italic"

[font.offset]
x = 0
y = 0

[colors]
draw_bold_text_with_bright_colors = true
